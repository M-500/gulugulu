  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: minio
    restart: unless-stopped

    ports:
      # S3 API
      - "9000:9000"
      # MinIO Console
      - "9001:9001"

    environment:
      # 管理账号
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "Admin@123456"

      # 开启浏览器控制台
      MINIO_BROWSER: "on"

      # 前端跨域配置
      # 多个域名使用逗号分隔
      MINIO_API_CORS_ALLOW_ORIGIN: "*"

    volumes:
      - ./data:/data
      - ./config:/root/.minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  minio_data:
  redis_data:
  kafka_data:
