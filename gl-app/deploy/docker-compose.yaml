services:
  redis:
    image: redis:7.4-alpine
    container_name: gulugulu-redis
    command: redis-server --appendonly yes
    ports:
      - "16377:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mysql:
    image: mysql:8.0
    container_name: gulugulu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Gulu.Wll&8123asd123"
      TZ: Asia/Shanghai
    volumes:
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/data:/var/lib/mysql
      - ./mysql/logs:/var/log/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "13116:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
  kafka:
    image: bitnami/kafka:3.9.0
    container_name: gulugulu-kafka
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - TZ=Asia/Shanghai
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - '19192:9092'
      - '19194:9094'

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: minio
    restart: unless-stopped

    ports:
      # S3 API
      - "19100:9000"
      # MinIO Console
      - "19101:9001"

    environment:
      # 管理账号
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "Admin@123456"

      # 本地开发统一使用 localhost，避免 127.0.0.1 和 localhost 在 CORS 中混用。
      MINIO_SERVER_URL: http://localhost:9000

      # 开启浏览器控制台
      MINIO_BROWSER: "on"

      # 前端跨域配置
      # 多个域名使用逗号分隔
      MINIO_API_CORS_ALLOW_ORIGIN: "*"

    volumes:
      - ./data:/data
      - ./config:/root/.minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  minio_data:
  redis_data:
  kafka_data:
