Name: gulu
Host: 0.0.0.0
Port: 8888
# HTTP请求体最大100MB，覆盖go-zero默认的1MB限制。
MaxBytes: 104857600

# MySQL配置
Mysql:
  DataSource: root:wulinlin@tcp(192.168.10.26:3306)/gulugulu?charset=utf8mb4&parseTime=True&loc=Local

CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node
    Pass:

# 密码加密的盐
Salt: ZfhVOFkGgPTryWxCwd7qnJaZR9KQ2i8xe

#jwtAuth
JwtAuth:
  AccessSecret: ae0536f9-6450-4606-8e13-5a19ed505da0
  AccessExpire: 31536000

# MinIO临时上传桶配置
Minio:
  Endpoint: localhost:9000
  AccessKeyID: f6Mmh9tqjBFDGnWwI19O
  SecretAccessKey: QpeXo8qxxLdeUlNYt1PXMgzGb4j8kx9I37TjDwqN
  UseSSL: false
  TempBucket: gulugulu-temp
  FormalBucket: gulugulu-media
  PublicBucket: gulugulu-public
  PresignExpire: 900

# Kafka媒体处理队列。API通过kq.Pusher投递，mediaworker通过kq消费。
MediaQueue:
  Name: media-worker
  Brokers:
    - 192.168.10.109:9094
  Group: gulugulu-media-workers
  Topic: gulugulu-media-tasks
  Offset: first
  Conns: 1
  Consumers: 1
  Processors: 2
  # false表示处理器返回错误时不提交offset，由Kafka重新投递。
  ForceCommit: false
  CommitInOrder: false
  MaxRetry: 3

MediaWorker:
  FFmpegPath: ffmpeg
  FFprobePath: ffprobe
  TempDir: /tmp/gulugulu-media
  HlsTime: 6

# MVP阶段审核员用户ID；生产环境建议改为RBAC权限校验。
Audit:
  AdminUserIds: [1]
